[package]
name = "stringcheese"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The stringcheese CTF tool rewritten in Rust"
keywords = ["CTF", "encoding", "tools"]
repository = "https://github.com/tritoke/red-leicester-string"

[dependencies]
aho-corasick = "1.1.5"
base32 = "0.5.1"
base64 = { version = "0.23.1", features = ["std"] }
charset = "0.1.5"
clap = { version = "4.6.6", features = ["derive"] }
encoding_rs = { version = "0.8.35", default-features = false, features = ["alloc"] }
hex = "0.4.3"
lru = "0.18.2"
memchr = { version = "2.8.3", default-features = false }
memmap = "0.7.0"
rayon = "1.12.0"
serde_json = "1.0.151"
strided = "0.2.9"

[dev-dependencies]
rand = "0.10.2"
rstest = "0.26.1"
